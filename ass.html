<!DOCTYPE html>
<html>
<head>
    <title>Student Assignments</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ user }}</h2>
        <h3>Your Assignments:</h3>
        <ul>
            {% for item in assignments %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
